<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Multiple Table Generator</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>

    <main class="container">

        <h1>Multiple Table Generator</h1>

        <label for="startNumber">Starting Number</label>

        <input type="number" id="startNumber" placeholder="Enter starting number">

        <label for="endNumber">Ending Number</label>

        <input type="number" id="endNumber" placeholder="Enter ending number">

        <button id="generateBtn">Generate Tables</button>

        <button id="clearBtn">Clear Results</button>

        <div id="results"></div>

    </main>

    <script src="script.js"></script>

</body>
</html>
